version: '3.8'

services:
  app:
    build: .
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      - hf_cache:/app/.cache/huggingface
      - spotify_cache:/app/.cache/spotify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  hf_cache:
  spotify_cache:
